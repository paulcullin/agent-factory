name: CI

# The single deterministic gate, run on every push and PR. This must mirror
# the local `<runner> check` so "green in CI" == "green locally".
#
# This file ships to stamped projects (where the project lives at the repo
# root) AND runs in the agent-factory template repo itself (where the only
# checkable code is templates/node-ts). Each job no-ops cleanly when its target
# isn't present, so the same file is green in both contexts.
#
# GOTCHA: pushing this workflow file needs the `workflow` token scope. If a
# push is rejected with a workflow-scope error, run:
#   gh auth refresh -s workflow

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The gate for a stamped project: runs `npm run check` at the repo root.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect root project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root package.json — skipping (this is the template repo)."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Check (typecheck + lint + test + build)
        if: steps.detect.outputs.present == 'true'
        run: npm run check

  # Keeps the shipped stack templates green in the agent-factory repo itself.
  # No-ops in stamped projects (they have no templates/ directory).
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect node-ts template
        id: detect
        run: |
          if [ -f templates/node-ts/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No templates/node-ts — skipping (this is a stamped project)."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: templates/node-ts/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: templates/node-ts
        run: npm ci

      - name: Check (typecheck + lint + test + build)
        if: steps.detect.outputs.present == 'true'
        working-directory: templates/node-ts
        run: npm run check
